<style>
:root{
  color-scheme: light dark;
  --bg:#faf6ef; --card:#ffffff; --text:#221c16; --muted:#6b5f52; --line:#d9cfc0;
  --accent:#a35f00; --accent-ink:#ffffff; --chip:#f1e9dc; --danger:#b3261e; --board:#ffffff; --stubrow:#f4ede1;
  --display:'Bebas Neue','Arial Narrow',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15110d; --card:#1d1711; --text:#f6eee2; --muted:#b9aa96; --line:#4a3f33;
    --accent:#f2b04a; --accent-ink:#1b1408; --chip:#261e16; --danger:#ff8a80; --board:#0b0806; --stubrow:#1d1711;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 8px) 16px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-family:var(--display);font-size:40px;line-height:1;letter-spacing:.14em;text-transform:uppercase;font-weight:400;color:var(--accent)}
.bulbs{border-top:6px dotted var(--accent);height:0;margin:8px 0 12px}
.topbtns{display:flex;align-items:center;gap:4px}
.addbtn{height:44px;padding:0 14px;border:0;border-radius:4px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:22px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.iconbtn{border:0;background:var(--chip);width:40px;height:40px;border-radius:20px;font-size:18px}
.gear{width:50px;height:50px;border-radius:25px;font-size:30px;line-height:1;background:none;color:var(--text);padding:0}
.views{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-bottom:12px}
.view{height:44px;border:1px solid var(--line);border-radius:4px;background:none;color:var(--text);
  font-family:var(--display);font-size:22px;letter-spacing:.08em;text-transform:uppercase;padding:0}
.view.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.view small{font-size:22px;margin-left:6px;opacity:.8}
.where{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;
  padding:8px 16px calc(env(safe-area-inset-bottom) + 8px);background:var(--bg);border-top:1px solid var(--line)}
.seg{white-space:nowrap;height:58px;border:1px solid var(--line);border-radius:4px;background:none;padding:0 2px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:600;color:var(--muted);line-height:1.15;text-align:center}
.seg b{font-family:var(--display);font-size:22px;font-weight:400;line-height:1;color:var(--text)}
.seg.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg.on b{color:inherit}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0 10px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;
  padding:7px 13px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab b{font-weight:700;opacity:.8;margin-left:5px}
main{padding:14px 16px calc(env(safe-area-inset-bottom) + 100px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;align-items:start}
.movie{border:0;padding:0;background:none;text-align:left;position:relative;display:block;align-self:start;width:100%}
.poster{width:100%;aspect-ratio:2/3;border-radius:10px;background:var(--chip);object-fit:cover;display:block}
.noposter{display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;
  font-size:13px;font-weight:600;color:var(--muted)}
.movie .t{font-size:13px;font-weight:600;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.movie .s{font-size:12px;color:var(--muted)}
.who{position:absolute;top:6px;left:6px;background:var(--accent);color:var(--accent-ink);
  min-width:22px;height:22px;padding:0 5px;border-radius:11px;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.logos{position:absolute;right:5px;top:5px;display:flex;flex-direction:column;gap:3px}
.logos img{width:22px;height:22px;border-radius:5px;display:block}
.src{width:24px;height:24px;border-radius:6px;background:var(--text);color:var(--bg);font-size:14px;font-weight:800;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.empty{text-align:center;color:var(--muted);padding:56px 20px}
.board{background:var(--board);border:2px solid var(--accent);border-radius:6px;padding:14px 12px 12px;display:flex;flex-direction:column;gap:8px}
.boardhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.boardhead .meta{text-align:right}
.boardlab{white-space:nowrap;font-family:var(--display);font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.stubrow{display:flex;min-height:72px;padding:0;border:0;border-radius:4px;overflow:hidden;background:var(--stubrow);color:var(--text);text-align:left;width:100%}
.stub{flex:none;width:66px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center}
.stub b{font-family:var(--display);font-size:36px;font-weight:400;line-height:.9}
.stub i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.12em}
.stubbody{flex:1;min-width:0;border-left:3px dashed var(--board);padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.st{font-family:var(--display);font-size:24px;line-height:1;letter-spacing:.05em;text-transform:uppercase}
.sm{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.chip{height:44px;padding:0 14px;border:1px solid var(--line);background:transparent;border-radius:4px;font-size:13px;font-weight:600;color:var(--text)}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:700}
.row2{display:flex;gap:8px;margin-bottom:18px}
.row2 .btn{margin-top:12px}
.btn.outline{background:none;border:1px solid var(--accent);color:var(--accent)}
.alist{border-top:1px solid var(--line)}
.arow{display:flex;justify-content:space-between;align-items:baseline;gap:14px;width:100%;border:0;
  border-bottom:1px solid var(--line);background:none;padding:13px 2px;text-align:left;font-size:16px}
.arow .y{color:var(--muted);font-size:14px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.grid.one{grid-template-columns:minmax(0,210px);justify-content:center}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 88px);z-index:7;border:0;
  background:var(--accent);color:var(--accent-ink);height:56px;padding:0 22px;border-radius:28px;
  font-weight:800;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
footer{text-align:center;font-size:12px;color:var(--muted);padding:26px 0 0}
footer a{color:inherit}
dialog{border:0;padding:0;background:var(--bg);color:var(--text);width:100%;max-width:560px;
  max-height:92dvh;border-radius:18px 18px 0 0;margin:auto auto 0;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
@media (min-width:600px){dialog{border-radius:18px;margin:auto}}
.sheet{padding:16px 16px calc(env(safe-area-inset-bottom) + 22px)}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.sheethead h2{margin:0;font-size:19px}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.result{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;
  padding:8px 0;text-align:left;border-bottom:1px solid var(--line)}
.result img,.result .ph{width:46px;height:69px;border-radius:6px;background:var(--chip);object-fit:cover;flex:0 0 auto}
.result .on{color:var(--accent);font-size:12px;font-weight:700}
.hero{display:flex;gap:14px}
.hero img,.hero .ph{width:112px;height:168px;border-radius:10px;background:var(--chip);object-fit:cover;flex:0 0 auto}
.hero h2{margin:0 0 4px;font-size:21px;line-height:1.2}
.meta{color:var(--muted);font-size:14px}
.badge{display:inline-block;margin-top:10px;padding:5px 10px;border-radius:999px;background:var(--accent);
  color:var(--accent-ink);font-size:13px;font-weight:700}
.overview{font-size:14px;margin:14px 0;color:var(--text)}
.block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.block h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .k{width:58px;flex:0 0 auto;font-size:13px;font-weight:700;padding-top:6px}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.prov{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:8px;padding:3px 8px 3px 3px;font-size:12px}
.prov img{width:26px;height:26px;border-radius:6px}
.prov.mine{outline:2px solid var(--accent)}
.none{color:var(--muted);font-size:13px;padding-top:6px}
.btn{display:block;width:100%;border:0;border-radius:6px;padding:13px;font-weight:700;margin-top:10px;
  background:var(--chip);text-align:center;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:none;color:var(--danger)}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;font-size:28px;padding:0 2px;color:var(--line)}
.stars button.on{color:var(--accent)}
.rate{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:3px 0}
label.check{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px}
label.check input{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.center{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px;text-align:center;gap:14px}
.center .btn{max-width:300px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:88vw}
select.field,textarea.field{margin-top:8px}
</style>

<body>
<div id="app"><div class="center"><h1>Marquee</h1><div class="meta">Loading…</div></div></div>
<dialog id="dlg"></dialog>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, deleteField }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDMmNIoSvBso_fBHl25tBbHCRePZFiwJUo",
  authDomain: "marquee-63897.firebaseapp.com",
  projectId: "marquee-63897",
  storageBucket: "marquee-63897.firebasestorage.app",
  messagingSenderId: "847318923234",
  appId: "1:847318923234:web:76cd90621f518ae8af2bbb"
};

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);

/* Subscriptions. "match" is tested against the provider name TMDB/JustWatch returns. */
const SERVICES = [
  { id:'appletv',     name:'Apple TV',          match:/apple tv/i },
  { id:'netflix',     name:'Netflix',           match:/netflix/i },
  { id:'disney',      name:'Disney+',           match:/disney/i },
  { id:'hulu',        name:'Hulu',              match:/hulu/i },
  { id:'paramount',   name:'Paramount+',        match:/paramount/i },
  { id:'prime',       name:'Prime Video',       match:/prime video/i },
  { id:'hbomax',      name:'HBO Max',           match:/\bhbo\b|\bmax\b/i },
  { id:'mubi',        name:'Mubi',              match:/mubi/i },
  { id:'peacock',     name:'Peacock',           match:/peacock/i },
  { id:'crunchyroll', name:'Crunchyroll',       match:/crunchyroll/i },
  { id:'criterion',   name:'Criterion Channel', match:/criterion/i }
];
const TABS = [
  { id:'tonight', label:'Next' },
  { id:'all',     label:'List' },
  { id:'home',    label:'At home' },
  { id:'stream',  label:'Streaming now' },
  { id:'rent',    label:'Rent or buy' },
  { id:'soon',    label:'Coming soon' },
  { id:'hunt',    label:'Track down' },
  { id:'watched', label:'Watched' }
];
const TIMES = [
  { id:'any',  label:'Any length' },
  { id:'90',   label:'Under 90 min', max:90 },
  { id:'120',  label:'Under 2 hours', max:120 },
  { id:'long', label:'2 hours or more', min:120 }
];
const SEEN = [
  { id:'any', label:'Either' },
  { id:'new', label:'New to us', test: m => !m.rewatch },
  { id:'re',  label:'Rewatch',   test: m => !!m.rewatch }
];
const SRC_LETTER = { Jellyfin:'J', Apple:'A', Disc:'D', Other:'O' };
const MOODS = [
  { id:'any',      label:'Anything' },
  { id:'classics', label:'Classics', test: m => Number(m.year) >= 1920 && Number(m.year) <= 1969 },
  { id:'light',    label:'Light', g:['Comedy','Family','Animation','Romance','Music'] },
  { id:'tense',    label:'Tense', g:['Thriller','Horror','Crime','Mystery'] },
  { id:'epic',     label:'Big adventure', g:['Adventure','Action','Science Fiction','Fantasy','War','Western'] },
  { id:'serious',  label:'Serious', g:['Drama','History','Documentary'] }
];
const IMG = 'https://image.tmdb.org/t/p/';
const DAY = 24 * 60 * 60 * 1000;

const S = {
  user:null, movies:new Map(), config:{}, jf:{ items:{} },
  tab:'tonight', tabChosen:false, tn:{ time:'any', mood:'any', seen:'any', rent:false, picks:[] }, ready:false, denied:false, open:null, refreshed:false
};

const $ = (sel, root=document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app'), dlg = $('#dlg');
const firstName = u => (u?.displayName || u?.email || 'Someone').split(/[ @]/)[0];
/* Names people chose in Settings win over the name Google supplied when a movie was added. */
const nameOf = (uid, fallback) => (S.config.names && S.config.names[uid]) || fallback || 'Someone';
const myName = () => nameOf(S.user.uid, firstName(S.user));
function initialOf(name){
  const others = new Set([...Object.values(S.config.names || {}), ...[...S.movies.values()].map(m => nameOf(m.addedBy?.uid, m.addedBy?.name))]);
  const clash = [...others].some(n => n && n !== name && n[0].toUpperCase() === name[0].toUpperCase());
  return clash ? name.slice(0, 2) : name[0].toUpperCase();
}

function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}

/* ---------- availability logic ---------- */
function enabledServices(){
  const on = S.config.services;
  return SERVICES.filter(s => !Array.isArray(on) || on.includes(s.id));
}
const isMine = name => enabledServices().some(s => s.match.test(name));
function subs(m){
  const p = m.providers || {};
  return [...(p.flatrate||[]), ...(p.free||[]), ...(p.ads||[])];
}
function store(m){
  const p = m.providers || {};
  const all = [...(p.rent||[]).map(x => ({...x, how:'rent'})), ...(p.buy||[]).map(x => ({...x, how:'buy'}))];
  for (const re of [/apple/i, /amazon/i]) {
    const hits = all.filter(x => re.test(x.n));
    if (hits.length) return { name: re.source === 'apple' ? 'Apple' : 'Amazon', logo: hits[0].l,
      rent: hits.some(h => h.how === 'rent'), buy: hits.some(h => h.how === 'buy') };
  }
  return null;
}
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/\s*[\(\[][^\)\]]*[\)\]]\s*/g, ' ').replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ')
  .trim().replace(/^(the|a|an) /, '');
let appleIdx = new Map();
function buildApple(){
  appleIdx = new Map();
  for (const row of S.jf.apple || []) {
    const i = row.indexOf('\t'), key = norm(row.slice(i + 1));
    if (!key) continue;
    if (!appleIdx.has(key)) appleIdx.set(key, []);
    appleIdx.get(key).push(Number(row.slice(0, i)) || 0);
  }
}
/* Where a copy already lives: 'Jellyfin', 'Apple', a manual choice, or '' */
function owned(m){
  if (S.jf.items && S.jf.items[String(m.id)]) return 'Jellyfin';
  const years = appleIdx.get(norm(m.title)), y = Number(m.year) || 0;
  if (years && years.some(a => !a || !y || Math.abs(a - y) <= 1)) return 'Apple';
  return m.owned || '';
}
const OWNED_LABEL = { Jellyfin: 'At home in Jellyfin', Apple: 'In your Apple library', Disc: 'Owned on disc', Other: 'Owned' };
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const daysSince = iso => iso ? Math.floor((Date.parse(todayStr()) - Date.parse(iso)) / DAY) : NaN;
const fmtDate = iso => { const [y, mo, da] = iso.split('-').map(Number); return new Date(y, mo - 1, da).toLocaleDateString(undefined, { month: 'short', day: 'numeric', ...(y !== new Date().getFullYear() ? { year: 'numeric' } : {}) }); };
/* A movie with nowhere to watch it yet counts as "coming soon" when it has a release
   date ahead of it, or reached US theaters within the last six months. */
function soonInfo(m){
  const r = m.rel || {}, today = todayStr(), opened = r.theatrical || r.primary;
  if (r.digital && r.digital > today) return { label: 'Digital ' + fmtDate(r.digital), date: r.digital };
  if (opened && opened > today) return { label: 'In theaters ' + fmtDate(opened), date: opened };
  const age = daysSince(opened);
  if (age >= 0 && age <= 45) return { label: 'In theaters now', date: today };
  if (age > 45 && age <= 180) return { label: 'Not streaming yet', date: today };
  return null;
}
function classify(m){
  if (m.watched) return 'watched';
  if (owned(m)) return 'home';
  if (subs(m).some(x => isMine(x.n))) return 'stream';
  if (store(m)) return 'rent';
  if (m.wait === 'soon') return 'soon';
  if (m.wait === 'hunt') return 'hunt';
  return soonInfo(m) ? 'soon' : 'hunt';
}

/* ---------- TMDB ---------- */
async function tmdb(path, params = {}){
  const key = (S.config.tmdbKey || '').trim();
  if (!key) throw new Error('nokey');
  const u = new URL('https://api.themoviedb.org/3' + path);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  const opt = {};
  if (key.startsWith('eyJ')) opt.headers = { Authorization: 'Bearer ' + key };
  else u.searchParams.set('api_key', key);
  const r = await fetch(u, opt);
  if (!r.ok) throw new Error('TMDB error ' + r.status);
  return r.json();
}
const slim = list => (list || []).map(x => ({ n: x.provider_name, l: x.logo_path || '' }));
function pickRelease(d){
  const us = (d?.release_dates?.results || []).find(r => r.iso_3166_1 === 'US');
  const first = types => (us?.release_dates || []).filter(r => types.includes(r.type)).map(r => (r.release_date || '').slice(0, 10)).filter(Boolean).sort()[0] || '';
  return { theatrical: first([3, 2]) || first([1]), digital: first([4]), physical: first([5]), primary: d?.release_date || '' };
}
function pickProviders(d){
  const us = d?.['watch/providers']?.results?.US || {};
  return { link: us.link || '', flatrate: slim(us.flatrate), free: slim(us.free), ads: slim(us.ads),
           rent: slim(us.rent), buy: slim(us.buy), at: Date.now() };
}
async function fetchMovie(id){
  const d = await tmdb('/movie/' + id, { append_to_response: 'watch/providers,release_dates' });
  return {
    id: d.id, title: d.title || '', year: (d.release_date || '').slice(0, 4), poster: d.poster_path || '',
    runtime: d.runtime || 0, genres: (d.genres || []).map(g => g.name), overview: d.overview || '',
    providers: pickProviders(d), rel: pickRelease(d)
  };
}
async function refreshProviders(id){
  const d = await tmdb('/movie/' + id, { append_to_response: 'watch/providers,release_dates' });
  await updateDoc(doc(db, 'movies', String(id)), { providers: pickProviders(d), rel: pickRelease(d) });
}
async function refreshStale(){
  if (S.refreshed || !S.config.tmdbKey || !S.movies.size) return;
  S.refreshed = true;
  for (const m of [...S.movies.values()]) {
    if (m.watched || (m.rel && (m.providers?.at || 0) > Date.now() - DAY)) continue;
    try { await refreshProviders(m.id); } catch (e) { break; }
    await new Promise(r => setTimeout(r, 300));
  }
}

/* ---------- data ---------- */
function listen(){
  const fail = e => { if (e.code === 'permission-denied') { S.denied = true; render(); } else toast(e.message); };
  onSnapshot(collection(db, 'movies'), snap => {
    S.movies = new Map(snap.docs.map(d => [d.id, d.data()]));
    S.ready = true; render(); refreshStale();
  }, fail);
  onSnapshot(doc(db, 'config', 'app'), d => { S.config = d.data() || {}; render(); refreshStale(); }, fail);
  onSnapshot(doc(db, 'jellyfin', 'library'), d => { S.jf = d.data() || { items:{} }; buildApple(); render(); }, () => {});
}
async function addMovie(id){
  if (S.movies.has(String(id))) { toast('Already on the list'); return; }
  try {
    const m = await fetchMovie(id);
    await setDoc(doc(db, 'movies', String(id)), {
      ...m, addedBy: { uid: S.user.uid, name: myName() }, addedAt: Date.now(),
      watched: false, ratings: {}, format: '', notes: '', why: '', owned: '', wait: ''
    });
    const cat = classify({ ...m, watched: false });
    S.tab = cat; S.tabChosen = true; render(); window.scrollTo(0, 0); renderDetail(String(id));
    toast('Added ' + m.title + ' to ' + TABS.find(t => t.id === cat).label);
  } catch (e) { toast(e.message === 'nokey' ? 'Add your TMDB key in Settings first' : e.message); }
}
const patch = (id, data) => updateDoc(doc(db, 'movies', String(id)), data).catch(e => toast(e.message));
const saveConfig = data => setDoc(doc(db, 'config', 'app'), data, { merge: true }).catch(e => toast(e.message));

/* ---------- rendering ---------- */
function posterTag(m, size = 'w342'){
  return m.poster ? `<img class="poster" loading="lazy" alt="" src="${IMG}${size}${esc(m.poster)}">`
                  : `<div class="poster noposter">${esc(m.title)}</div>`;
}
function cardLogos(m, cat){
  if (cat === 'home') { const o = owned(m); return `<span class="src" title="${esc(OWNED_LABEL[o] || 'Owned')}">${SRC_LETTER[o] || '•'}</span>`; }
  let items = [];
  if (cat === 'stream') {
    const bySvc = new Map();
    for (const x of subs(m)) {
      const svc = enabledServices().find(sv => sv.match.test(x.n));
      if (svc && x.l && !bySvc.has(svc.id)) bySvc.set(svc.id, x);
    }
    items = [...bySvc.values()];
  }
  if (cat === 'rent') { const s = store(m); if (s) items = [{ n: s.name, l: s.logo }]; }
  const seen = new Set();
  return items.filter(x => x.l && !seen.has(x.l) && seen.add(x.l)).slice(0, 3)
    .map(x => `<img alt="${esc(x.n)}" src="${IMG}w92${esc(x.l)}">`).join('');
}
function whereLabel(m, cat){
  if (cat === 'home') return OWNED_LABEL[owned(m)] || 'Owned';
  if (cat === 'stream') { const hit = subs(m).find(x => isMine(x.n)); return hit ? 'On ' + hit.n : 'Streaming'; }
  if (cat === 'rent') { const st = store(m); return st ? [st.rent && 'Rent', st.buy && 'Buy'].filter(Boolean).join('/') + ' on ' + st.name : 'Rent or buy'; }
  if (cat === 'soon') return soonInfo(m)?.label || 'Coming soon';
  return cat === 'hunt' ? 'Track down' : 'Watched';
}
function tonightPool(over = {}){
  const f = { ...S.tn, ...over };
  const t = TIMES.find(x => x.id === f.time), mood = MOODS.find(x => x.id === f.mood), seen = SEEN.find(x => x.id === f.seen);
  return [...S.movies.values()].filter(m => {
    const c = classify(m);
    if (!(c === 'home' || c === 'stream' || (f.rent && c === 'rent'))) return false;
    if (t.max && !(m.runtime > 0 && m.runtime <= t.max)) return false;
    if (t.min && !(m.runtime >= t.min)) return false;
    if (seen.test && !seen.test(m)) return false;
    if (mood.test && !mood.test(m)) return false;
    if (mood.g && !(m.genres || []).some(g => mood.g.includes(g))) return false;
    return true;
  });
}
function card(m){
  const cat = classify(m);
  const sub = (S.tab === 'all' || S.tab === 'tonight' || S.tab === 'soon') ? whereLabel(m, cat)
    : S.tab === 'home' ? m.year + ' · ' + owned(m)
    : m.year + (m.runtime ? ' · ' + m.runtime + ' min' : '');
  return `<button class="movie" data-act="open" data-id="${m.id}">
    ${posterTag(m)}
    <span class="who" title="Added by ${esc(nameOf(m.addedBy?.uid, m.addedBy?.name))}">${esc(initialOf(nameOf(m.addedBy?.uid, m.addedBy?.name)))}</span>
    <span class="logos">${cardLogos(m, cat)}</span>
    <div class="t">${esc(m.title)}</div>
    <div class="s">${esc(sub)}${m.rewatch ? ' · ↻' : ''}</div>
  </button>`;
}
function shuffled(list){
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function stubRow(m){
  const cat = classify(m);
  const bits = [m.year, whereLabel(m, cat), m.rewatch ? 'Rewatch' : 'Added by ' + nameOf(m.addedBy?.uid, m.addedBy?.name)].filter(Boolean);
  return `<button class="stubrow" data-act="open" data-id="${m.id}">
    <span class="stub"><b>${m.runtime || '?'}</b><i>MIN</i></span>
    <span class="stubbody"><span class="st">${esc(m.title)}</span><span class="sm">${esc(bits.join(' · '))}</span></span>
  </button>`;
}
function tonightHTML(){
  const pool = tonightPool(), ids = pool.map(m => String(m.id));
  S.tn.picks = S.tn.picks.filter(id => ids.includes(id));
  if (!S.tn.picks.length && ids.length) S.tn.picks = shuffled(ids).slice(0, 3);
  const picks = S.tn.picks.map(id => S.movies.get(id)).filter(Boolean);
  const none = S.tn.time === 'any' && S.tn.mood === 'any' && S.tn.seen === 'any' && !S.tn.rent;
  /* Only offer choices that have at least one movie ready to watch, given the other filters. */
  const group = (k, opts) => opts.filter(o => o.id !== 'any').map(o => {
    const n = tonightPool({ [k]: o.id }).length;
    if (n === 0 && S.tn[k] !== o.id) return '';
    return `<button class="chip ${S.tn[k] === o.id ? 'on' : ''}" data-act="tn" data-k="${k}" data-v="${o.id}">${o.label} · ${n}</button>`;
  }).join('');
  const extra = tonightPool({ rent: true }).length - tonightPool({ rent: false }).length;
  return `<section class="tonight">
    <div class="board">
      <div class="boardhead"><span class="boardlab">Now showing</span><span class="meta">${picks.length} of ${pool.length} ready tonight</span></div>
      ${picks.length ? picks.map(stubRow).join('') : `<div class="empty" style="padding:26px 10px">${S.movies.size ? 'Nothing fits. Clear a filter, or include rent or buy.' : 'Your list is empty. Tap + Add movie to start.'}</div>`}
    </div>
    <div class="chips">
      <button class="chip ${none ? 'on' : ''}" data-act="tnclear">Anything</button>
      ${group('time', TIMES)}${group('mood', MOODS)}${group('seen', SEEN)}
      ${extra > 0 || S.tn.rent ? `<button class="chip ${S.tn.rent ? 'on' : ''}" data-act="tnrent">Rent or buy${S.tn.rent ? '' : ' · ' + extra}</button>` : ''}
    </div>
    <div class="row2">
      <button class="btn primary" data-act="roll" data-n="1">Pick one for us</button>
      <button class="btn outline" data-act="roll" data-n="3">Show three</button>
    </div>
  </section>`;
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'signin') {
    const provider = new GoogleAuthProvider();
    try { await signInWithPopup(auth, provider); }
    catch (err) {
      if (/popup|operation-not-supported|web-storage/.test(err.code || '')) signInWithRedirect(auth, provider);
      else if (err.code !== 'auth/cancelled-popup-request') toast(err.message);
    }
  }
  else if (act === 'signout') { if (dlg.open) dlg.close(); await signOut(auth); location.reload(); }
  else if (act === 'tab') { S.tab = id; S.tabChosen = true; render(); window.scrollTo(0, 0); }
  else if (act === 'tn') { const k = el.dataset.k; S.tn[k] = S.tn[k] === el.dataset.v ? 'any' : el.dataset.v; S.tn.picks = []; render(); }
  else if (act === 'tnrent') { S.tn.rent = !S.tn.rent; S.tn.picks = []; render(); }
  else if (act === 'tnclear') { S.tn = { time:'any', mood:'any', seen:'any', rent:false, picks:[] }; render(); }
  else if (act === 'roll') {
    const n = Number(el.dataset.n), pool = tonightPool().map(m => String(m.id));
    const fresh = pool.filter(x => !S.tn.picks.includes(x));
    const from = shuffled(fresh.length >= Math.min(n, pool.length) ? fresh : pool);
    S.tn.picks = from.slice(0, n); render();
  }
  else if (act === 'open') renderDetail(id);
  else if (act === 'add') renderAdd();
  else if (act === 'settings') renderSettings();
  else if (act === 'close') { S.open = null; dlg.close(); }
  else if (act === 'pick') { dlg.close(); await addMovie(id); }
  else if (act === 'watched') {
    const m = S.movies.get(S.open);
    patch(S.open, m.watched ? { watched: false, watchedAt: deleteField() } : { watched: true, watchedAt: Date.now() });
  }
  else if (act === 'rewatch') patch(S.open, { rewatch: el.dataset.v === '1' });
  else if (act === 'rate') patch(S.open, { ['ratings.' + S.user.uid]: { name: myName(), stars: Number(el.dataset.n) } });
  else if (act === 'refresh') {
    try { await refreshProviders(S.open); toast('Availability updated'); }
    catch (err) { toast(err.message === 'nokey' ? 'Add your TMDB key in Settings first' : err.message); }
  }
  else if (act === 'remove') {
    const m = S.movies.get(S.open);
    if (el.dataset.sure) { const gone = S.open; S.open = null; dlg.close(); await deleteDoc(doc(db, 'movies', gone)); toast('Removed ' + m.title); }
    else { el.dataset.sure = '1'; el.textContent = 'Tap again to remove'; }
  }
  else if (act === 'savesettings') {
    const services = [...dlg.querySelectorAll('[data-svc]')].filter(c => c.checked).map(c => c.dataset.svc);
    const mine = $('#myname', dlg).value.trim() || firstName(S.user);
    await saveConfig({ services, tmdbKey: $('#tmdbkey', dlg).value.trim(), jellyfinUrl: $('#jfurl', dlg).value.trim(), names: { [S.user.uid]: mine } });
    S.refreshed = false; dlg.close(); toast('Saved');
  }
  else if (act === 'export') {
    const blob = new Blob([JSON.stringify([...S.movies.values()], null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'marquee-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
  }
});
dlg.addEventListener('change', e => {
  const key = e.target.dataset.change;
  if (key && S.open) patch(S.open, { [key]: e.target.value });
});
dlg.addEventListener('click', e => { if (e.target === dlg) { S.open = null; dlg.close(); } });
dlg.addEventListener('close', () => { S.open = null; });

let listening = false;
onAuthStateChanged(auth, user => {
  S.user = user; render();
  if (user && !listening) { listening = true; listen(); }
});
</script>
</body>
</html>
